# Secret NAMES the workflow reads (runtime.getSecret), each mapped to the environment variable that holds
# its value. In simulation the CLI reads those variables from the shell or from ./.env (gitignored);
# deployed, they come from the Vault DON. No value ever goes in this file.
secretsNames:
  DATASTREAMS_API_KEY:
    - DATASTREAMS_API_KEY_VAR
  DATASTREAMS_API_SECRET:
    - DATASTREAMS_API_SECRET_VAR
