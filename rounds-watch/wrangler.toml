name = "mako-rounds-watch"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Alert-only liveness watch for MakoRoundsV1 (TASKS T2.0d, INVARIANTS N21): flags every two-sided round
# unsettled 30 minutes after close, and every NoPrice refund, saying whether Chainlink reports existed for
# both seconds. No wallet key; sends nothing on-chain; separate from the keeper so it fails independently.

[triggers]
# Minutes 1, 6, 11, ...: off the watchdog's minutes, so at most one five-minute Worker shares a minute with the
# keeper and the resolver (Codex WORKERS_NO_BATCH R1 F2).
crons = ["1,6,11,16,21,26,31,36,41,46,51,56 * * * *"]

[limits]
cpu_ms = 5000
subrequests = 20

[[durable_objects.bindings]]
name = "WATCH_STATE"
class_name = "WatchState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchState"]

# rounds-delivery/ sits outside this package and imports viem; bundle it against the copy here.
[alias]
"viem" = "./node_modules/viem"

[observability]
enabled = true

# ROUNDS_ADDRESS is set once the contract is deployed; the Worker refuses to run without it.
[vars]
RPC_URL = "https://testnet-rpc.monad.xyz/"
# MakoRoundsV1, deployed 2026-10-06 (mako-contracts 1d787f6 receipt).
ROUNDS_ADDRESS = "0x9dC0e0b9E8F1905740D8B98E90fe07288dcC2921"
DATASTREAMS_URL = "https://api.testnet-dataengine.chain.link"

# Secrets, via `wrangler secret put`, from Bitwarden, never in this file:
#   DATASTREAMS_API_KEY, DATASTREAMS_API_SECRET   (read-only report access)
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID          (the watchdog's bot)
#   HEALTHCHECKS_PING_URL                         (its own check: period 5 min, grace 15 min)
