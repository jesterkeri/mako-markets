name = "mako-auto-resolver"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# Non-secret config. MAKO_ADDRESS is public (it's on-chain); RPC URL is
# the public Monad testnet endpoint. If the contract ever redeploys,
# bump MAKO_ADDRESS here + redeploy the Worker.
[vars]
MAKO_ADDRESS = "0xbC5A58487D7949dA2B76aC84AfC032fD0aa26195"
MONAD_RPC_URL = "https://testnet-rpc.monad.xyz/"
# Mako Markets Vercel URL — used by the AA cron scheduler to fire
# /api/cron/aa-fast (every minute) and /api/cron/aa-slow (every 5 min)
# against the deployed Next.js app. Vercel Hobby plan rejects sub-daily
# crons in vercel.json; the Worker fills the gap by acting as the
# scheduler and HTTP-pinging the cron routes with Bearer CRON_SECRET.
MAKO_APP_URL = "https://mako-markets.vercel.app"

# Cron: every minute. CF cron is reliable to the minute (unlike GitHub
# Actions cron which drifts to 1-2 hours under load). Markets with
# closeTime ≥ 60s will resolve within ~1 tick of close. Each tick also
# fires Vercel cron routes:
#   every minute  → /api/cron/aa-fast + /api/cron/pm-indexer
#   every 5 min   → /api/cron/aa-slow + /api/cron/pm-maintenance
# Routes are gated by Bearer CRON_SECRET on the Vercel side.
[triggers]
crons = ["*/1 * * * *"]

# Enable logs so `wrangler tail` shows live tick output.
[observability]
enabled = true

# Secrets (set via `wrangler secret put <name>`, NOT in this file):
#   ADMIN_PRIVATE_KEY       — 0x + 64 hex, the resolver wallet
#   FOOTBALL_DATA_API_KEY   — football-data.org key (football resolution)
#   BALLDONTLIE_API_KEY     — balldontlie.io key (NBA resolution)
#   CRON_SECRET             — bearer token for /api/cron/aa-fast +
#                             /api/cron/aa-slow on the Vercel side.
#                             MUST match the value set in
#                             `vercel env ls production`.
