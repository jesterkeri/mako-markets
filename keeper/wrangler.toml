name = "mako-rounds-keeper"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Settles MakoRoundsV1 rounds (SPEC §5.5, TASKS T2.0c). Every minute: take the lease, check the last
# transaction, pick one round at least 5 minutes past close, fetch its two Data Streams reports, simulate
# `settle`, and send it from a gas-only key. Never more than one transaction in flight.

[triggers]
crons = ["* * * * *"]

# Workers Paid (Joshua, 2026-09-28). A run makes at most 10 outbound requests (T0.1c keeper bound).
[limits]
cpu_ms = 5000
subrequests = 20

# One SQLite-backed Durable Object holds the run lease and the in-flight transaction.
[[durable_objects.bindings]]
name = "KEEPER_STATE"
class_name = "KeeperState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KeeperState"]

# rounds-delivery/ sits outside this package and imports viem; bundle it against the copy here, the same
# pin vitest.config.ts applies with resolve.dedupe.
[alias]
"viem" = "./node_modules/viem"

[observability]
enabled = true

# Non-secret config. ROUNDS_ADDRESS (after the deployment) and KEEPER_ADDRESS (printed by
# scripts/keeper-key.sh) are set per environment; the Worker refuses to run without them.
# DRY_RUN = "true" does everything except send, and stays on until Joshua switches it off.
[vars]
RPC_URL = "https://testnet-rpc.monad.xyz/"
DATASTREAMS_URL = "https://api.testnet-dataengine.chain.link"
DRY_RUN = "true"

# Secrets, via `wrangler secret put`, from Bitwarden, never in this file:
#   KEEPER_PRIVATE_KEY      gas-only key (scripts/keeper-key.sh creates it and prints only the address)
#   DATASTREAMS_API_KEY
#   DATASTREAMS_API_SECRET
#   HEALTHCHECKS_PING_URL
