name = "mako-settlement-keeper"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Mako Settlement Keeper (SPEC §5.5, TASKS T2.0c; automatic refunds, Joshua 2026-09-29). Every minute: take
# the lease, check the last transaction, then do ONE thing, in this order: settle a round at least 5 minutes
# past close (its two Data Streams reports, simulated first); else refund an overdue round (finalizeRefund:
# one-sided, or 24 hours past close); else refund an overdue V4 pool (forceRefund, 24 hours past close) under
# a breaker of 3 per hour and 6 per day. One gas-only key; never more than one transaction in flight.

[triggers]
crons = ["* * * * *"]

# Workers Paid (Joshua, 2026-09-28). A run makes at most 10 outbound requests (T0.1c keeper bound).
[limits]
cpu_ms = 5000
subrequests = 20

# One SQLite-backed Durable Object holds the run lease and the in-flight transaction.
[[durable_objects.bindings]]
name = "KEEPER_STATE"
class_name = "KeeperState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KeeperState"]

# rounds-delivery/ sits outside this package and imports viem; bundle it against the copy here, the same
# pin vitest.config.ts applies with resolve.dedupe.
[alias]
"viem" = "./node_modules/viem"

[observability]
enabled = true

# Non-secret config. ROUNDS_ADDRESS (after the deployment) and KEEPER_ADDRESS (printed by
# scripts/keeper-key.sh) are set per environment; the Worker refuses to run without them.
# DRY_RUN = "true" does everything except send, and stays on until Joshua switches it off.
[vars]
RPC_URL = "https://testnet-rpc.monad.xyz/"
# Live MakoMarketsV4 (Pools), deployed from d088ced.
POOLS_ADDRESS = "0xbC5A58487D7949dA2B76aC84AfC032fD0aa26195"
# The breaker's reset: to resume automatic V4 refunds after a trip, set this to the CURRENT UTC time (after
# the trip, never in the future: a future time is ignored and the alarm says so) and deploy. Leave unset.
# REFUND_BREAKER_RESET = "<now, e.g. from: date -u +%Y-%m-%dT%H:%M:%SZ>"
DATASTREAMS_URL = "https://api.testnet-dataengine.chain.link"
DRY_RUN = "true"

# Secrets, via `wrangler secret put`, from Bitwarden, never in this file:
#   KEEPER_PRIVATE_KEY      gas-only key (scripts/keeper-key.sh creates it and prints only the address)
#   DATASTREAMS_API_KEY
#   DATASTREAMS_API_SECRET
#   HEALTHCHECKS_PING_URL
