<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>s6</title></head>
  <body>
    <template id="s6-template">
      <style>
@font-face{font-family:"Bricolage";font-weight:200 800;src:url("assets/fonts/bricolage.woff2") format("woff2-variations")}
@font-face{font-family:"Inter";font-weight:100 900;src:url("assets/fonts/inter.woff2") format("woff2-variations")}
@font-face{font-family:"JetBrains Mono";font-weight:400 800;src:url("assets/fonts/jbmono.woff2") format("woff2")}

#s6-root{position:absolute;inset:0;overflow:hidden;color:#F6F4EE;font-family:"Inter",sans-serif}
#s6-root .chip{position:absolute;display:flex;align-items:center;gap:14px;height:52px;padding:0 22px;background:#FACC15;color:#0C1410;font:800 24px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
#s6-root .chip i{display:block;width:12px;height:12px;background:#0C1410}
#s6-root .h1{position:absolute;font:800 96px/1 "Bricolage",sans-serif;letter-spacing:-.03em}
#s6-root .body{position:absolute;font:500 36px/1.3 "Inter",sans-serif}
#s6-root .mono{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
#s6-root .y{color:#FACC15}

#s6-root .chip{left:120px;top:170px}
#s6-root .h1{left:120px;top:250px;font-size:96px}
#s6-root .tbl{position:absolute;left:120px;top:390px;width:1680px}
#s6-root .tr{display:flex;align-items:center;min-height:130px;margin-bottom:12px;background:rgba(8,10,14,.78);border-left:10px solid #FACC15}
#s6-root .tr:nth-child(even){background:rgba(8,10,14,.66)}
#s6-root .n{flex:none;width:120px;font:800 64px/1 "Bricolage",sans-serif;color:#FACC15;text-align:center}
#s6-root .t{padding:22px 40px 22px 10px;font:500 38px/1.25 "Inter",sans-serif}
#s6-root .t b{font-weight:800;color:#FACC15}

      </style>
      <div id="s6-root" data-composition-id="s6" data-width="1920" data-height="1080" data-duration="7.5">

        <div class="chip"><i></i>The small print</div>
        <div class="h1">What counts</div>
        <div class="tbl">
          <div class="tr r1"><div class="n">1</div><div class="t">Only pools you <b>first bet on after the start</b> count.</div></div>
          <div class="tr r2"><div class="n">2</div><div class="t"><b>Claim your winnings before the end.</b> Unclaimed winnings do not count.</div></div>
          <div class="tr r3"><div class="n">3</div><div class="t">You need <b>at least 5 settled pools</b> to be ranked. Refunded pools do not count.</div></div>
          <div class="tr r4"><div class="n">4</div><div class="t">Ties go to the <b>higher win rate</b>: settled pools won out of settled pools played.</div></div>
        </div>

      </div>
      <script>
        (function () {
          var R = "#s6-root ";
          function q(s) { return R + s; }
          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q(".chip"), { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: .4, ease: "power3.out" }, .3);
          tl.fromTo(q(".h1"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: "power3.out" }, .4);
          [1, 2, 3, 4].forEach(function (n, i) {
            tl.fromTo(q(".r" + n), { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: .5, ease: "power3.out" }, .8 + i * 1.25);
            tl.fromTo(q(".r" + n + " .n"), { scale: 1.8 }, { scale: 1, duration: .45, ease: "back.out(2)" }, .95 + i * 1.25);
          });

          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
