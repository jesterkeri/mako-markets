<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GLASS s30 (film 42.0-43.5, key 43.1 = local 1.1). 3D glass card with a live dot slides into the phone. Phone left, camera from the right, high. -->
  </head>
  <body>
    <template id="s30-template">
      <style>
        @font-face{font-family:"Bricolage Grotesque Variable";font-style:normal;font-weight:200 800;src:url("../assets/fonts/captured-bricolage-grotesque-latin-wght-normal.0hh3pksc_dt39.woff2") format("woff2-variations");}
        @font-face{font-family:"Inter Variable";font-style:normal;font-weight:100 900;src:url("../assets/fonts/captured-inter-latin-wght-normal.055ydel_y7o6i.woff2") format("woff2-variations");}
        @font-face{font-family:"JetBrains Mono";font-weight:100 800;src:url("../assets/fonts/jbmono-latin.woff2") format("woff2");}
        #s30-root{position:absolute;inset:0;overflow:hidden;background:#000;color:#EDE6D6;font-family:"Inter Variable",sans-serif}
        #s30-gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
        #s30-shade{position:absolute;inset:0;background:linear-gradient(270deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.3) 36%,rgba(0,0,0,0) 54%)}
        #s30-brand{position:absolute;left:1120px;top:96px;display:flex;align-items:center;gap:14px;font:800 30px "Bricolage Grotesque Variable",sans-serif;letter-spacing:-.01em}
        #s30-brand svg{width:40px;height:31px;display:block}
        #s30-copy{position:absolute;left:1120px;top:400px;width:700px}
        #s30-h1{font:800 132px/0.95 "Bricolage Grotesque Variable",sans-serif;letter-spacing:-.045em;color:#EDE6D6}
        #s30-h1 .ln{display:block;overflow:hidden;padding-bottom:12px}
        #s30-h1 .ln > span{display:block;white-space:nowrap}
        #s30-dot{display:inline-block;width:30px;height:30px;border-radius:50%;background:#D946EF;margin-left:22px;vertical-align:middle;position:relative;top:-8px;box-shadow:0 0 28px rgba(217,70,239,.7)}
      </style>
      <div id="s30-root" data-composition-id="s30" data-width="1920" data-height="1080" data-duration="1.65">
        <canvas id="s30-gl" width="1920" height="1080"></canvas>
        <div id="s30-shade"></div>
        <div id="s30-brand"><svg viewBox="-3 -3 406 316"><path fill="#EDE6D6" d="M 25,285 L 80,259 C 80,227 112,177 123,169 L 115,251 L 150,259 C 160,186 246,135 246,135 C 246,135 226,156 211,196 C 196,235 196,259 196,259 L 239,308 C 229,222 306,86 380,5 C 298,40 193,111 160,153 C 160,153 155,132 163,104 C 170,76 184,50 183,47 C 112,81 44,221 25,285 Z"/></svg><span>Mako Market</span></div>
        <div id="s30-copy">
          <div id="s30-h1"><span class="ln"><span>Your pool</span></span><span class="ln"><span>is live<span id="s30-dot"></span></span></span></div>
        </div>
      </div>
      <script src="../assets/glass/glass-kit.js"></script>
      <script>
        (function () {
          var ID = "s30", DUR = 1.5, MG = window.MakoGlass, PI = Math.PI;
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          var g2 = document.getElementById(ID + "-gl").getContext("2d");
          var scr = null, card = null, cardFace = null, built = false;
          var SW = MG.SW, SH = MG.SH;

          // card face: live dot + LIVE, sample question, YES / NO
          function paintFace(cv, pulse) {
            var x = cv.getContext("2d"), w = cv.width, h = cv.height;
            x.clearRect(0, 0, w, h);
            x.textAlign = "left";
            x.textBaseline = "alphabetic";
            // live chip
            MG.rr(x, 70, 64, 250, 76, 38);
            x.fillStyle = "rgba(217,70,239,0.16)";
            x.fill();
            x.strokeStyle = "rgba(217,70,239,0.75)";
            x.lineWidth = 3;
            x.stroke();
            x.beginPath();
            x.arc(118, 102, 16 + 10 * pulse, 0, PI * 2);
            x.fillStyle = "rgba(217,70,239," + 0.35 * (1 - pulse) + ")";
            x.fill();
            x.beginPath();
            x.arc(118, 102, 15, 0, PI * 2);
            x.fillStyle = "#D946EF";
            x.fill();
            x.font = "600 40px " + MG.MO;
            x.fillStyle = "#EDE6D6";
            x.textBaseline = "middle";
            x.fillText("LIVE", 154, 104);
            x.textBaseline = "alphabetic";
            x.save();
            x.shadowColor = "rgba(0,0,0,0.4)";
            x.shadowBlur = 8;
            x.shadowOffsetY = 4;
            x.font = "800 92px " + MG.BR;
            x.fillStyle = "rgba(240,234,220,0.98)";
            x.fillText("Will ETH close", 70, 280);
            x.fillText("the week higher?", 70, 382);
            x.restore();
            MG.rr(x, 70, 450, 330, 120, 36);
            x.fillStyle = "rgba(250,204,21,0.92)";
            x.fill();
            MG.rr(x, 420, 450, 330, 120, 36);
            x.fillStyle = "rgba(217,74,61,0.9)";
            x.fill();
            x.font = "800 56px " + MG.BR;
            x.textAlign = "center";
            x.textBaseline = "middle";
            x.fillStyle = "#000";
            x.fillText("YES", 235, 512);
            x.fillStyle = "#EDE6D6";
            x.fillText("NO", 585, 512);
          }

          var S = { t: 0, slide: 0.05, pulse: 0, sheen: -1, ry: PI - 0.42, cx: 0.95, cy: 0.85, cz: 5.3 };

          function paint() {
            scr.wall(S.t + 16.0, 0.85);
            scr.text("MY POOLS", 30, 132, "600 11px " + MG.MO, "rgba(237,230,214,0.6)");
            scr.poolList(S.t, 0, 150, false);
            scr.header();
            scr.scrim(0.35 * MG.clamp(S.slide, 0, 1));
            scr.homeBar();
          }

          function frame() {
            if (!built) return;
            paint();
            var q = MG.ease.enter(MG.clamp(S.slide, 0, 1));
            MG.render({
              cam: { x: S.cx, y: S.cy, z: S.cz, lx: -0.35, ly: 0.12, lz: 0, fov: 34 },
              bg: { t: S.t * 1.6 + 27.0, gx: -0.5, gy: 0.2, gs: 0.08, rib: 1.1, ox: 0.5, oy: -0.2 },
              rim: [-3.5, 3, 2.5, 3.2],
              phone: { x: -1.25, y: -0.05, z: 0, rx: 0.06, ry: S.ry, rz: -0.03, screen: scr.canvas },
              slabs: [{ mesh: card, x: -(1 - q) * 2.6, y: 0.35 + (1 - q) * 0.25, z: -0.22 - (1 - q) * 0.7, rx: 0.0, ry: PI - (1 - q) * 0.5, rz: (1 - q) * -0.08, sheen: S.sheen, glow: 0.15 }],
            }, g2);
          }

          var inner = gsap.timeline({ paused: true });
          inner.to(S, { t: DUR, duration: DUR, ease: "none" }, 0);
          inner.to(S, { slide: 1, duration: 0.6, ease: "none" }, 0);
          inner.to(S, { sheen: 1.3, duration: 0.9, ease: "power1.inOut" }, 0.35);
          inner.fromTo(S, { pulse: 0 }, { pulse: 1, duration: 0.7, ease: "power1.out", repeat: 1 }, 0.1);
          inner.to(S, { ry: PI - 0.27, cx: 0.6, cy: 0.6, cz: 4.75, duration: DUR, ease: MG.ease.drift }, 0);

          var drvT = 0, drv = {};
          Object.defineProperty(drv, "t", {
            get: function () { return drvT; },
            set: function (v) { drvT = v; inner.time(v, true); frame(); },
          });
          var tl = gsap.timeline({ paused: true });
          tl.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s30-h1 .ln > span", { yPercent: 108, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.7, ease: "expo.out", stagger: 0.1 }, 0.1);
          tl.fromTo("#s30-dot", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, 0.55);
          tl.fromTo("#s30-brand", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);

          var lastPulse = -1;
          var baseFrame = frame;
          frame = function () {
            if (built && card) {
              var p = Math.round(S.pulse * 20) / 20;
              if (p !== lastPulse) {
                paintFace(cardFace, p);
                card.userData.tex.needsUpdate = true;
                lastPulse = p;
              }
            }
            baseFrame();
          };

          window.__hf.buildReady[ID] = MG.ready.then(MG.fonts).then(function () {
            scr = new MG.Screen();
            cardFace = MG.faceCanvas(1400, 640);
            paintFace(cardFace, 0);
            card = MG.slab({ w: 1.5, h: 0.686, r: 0.12, depth: 0.04, bevel: 0.025, face: cardFace, parent: "phone", frost: 0.01, lift: 0.9 });
            built = true;
            inner.time(drvT, true);
            frame();
          });
          window.__timelines[ID] = window.__hfPre(ID, tl);
        })();
      </script>
    </template>
  </body>
</html>
