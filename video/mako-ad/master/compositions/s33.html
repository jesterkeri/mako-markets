<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GLASS s33 (film 47.5-49.0, key 48.6 = local 1.1). Round page: 15:00 countdown, glass UP / DOWN toggle. Phone lying back, camera above. -->
  </head>
  <body>
    <template id="s33-template">
      <style>
        @font-face{font-family:"Bricolage Grotesque Variable";font-style:normal;font-weight:200 800;src:url("../assets/fonts/captured-bricolage-grotesque-latin-wght-normal.0hh3pksc_dt39.woff2") format("woff2-variations");}
        @font-face{font-family:"Inter Variable";font-style:normal;font-weight:100 900;src:url("../assets/fonts/captured-inter-latin-wght-normal.055ydel_y7o6i.woff2") format("woff2-variations");}
        @font-face{font-family:"JetBrains Mono";font-weight:100 800;src:url("../assets/fonts/jbmono-latin.woff2") format("woff2");}
        #s33-root{position:absolute;inset:0;overflow:hidden;background:#000;color:#EDE6D6;font-family:"Inter Variable",sans-serif}
        #s33-gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
        #s33-brand{position:absolute;left:140px;top:96px;display:flex;align-items:center;gap:14px;font:800 30px "Bricolage Grotesque Variable",sans-serif;letter-spacing:-.01em}
        #s33-brand svg{width:40px;height:31px;display:block}
      </style>
      <div id="s33-root" data-composition-id="s33" data-width="1920" data-height="1080" data-duration="1.7">
        <canvas id="s33-gl" width="1920" height="1080"></canvas>
        <div id="s33-brand"><svg viewBox="-3 -3 406 316"><path fill="#EDE6D6" d="M 25,285 L 80,259 C 80,227 112,177 123,169 L 115,251 L 150,259 C 160,186 246,135 246,135 C 246,135 226,156 211,196 C 196,235 196,259 196,259 L 239,308 C 229,222 306,86 380,5 C 298,40 193,111 160,153 C 160,153 155,132 163,104 C 170,76 184,50 183,47 C 112,81 44,221 25,285 Z"/></svg><span>Mako Market</span></div>
      </div>
      <script src="../assets/glass/glass-kit.js"></script>
      <script>
        (function () {
          var ID = "s33", DUR = 1.5, MG = window.MakoGlass, PI = Math.PI;
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          var g2 = document.getElementById(ID + "-gl").getContext("2d");
          var scr = null, built = false;
          var SW = MG.SW, SH = MG.SH;
          var PTS = [0.42, 0.5, 0.46, 0.58, 0.52, 0.47, 0.55, 0.63, 0.6, 0.68, 0.64, 0.72, 0.7, 0.76];

          var S = { t: 0, sec: 0, sel: 0.0, draw: 0.55, knob: 0, rx: -0.62, rz: 0.32, cx: -0.6, cy: 3.4, cz: 5.6 };

          function tri(c, x, y, s, up, color) {
            c.beginPath();
            if (up) { c.moveTo(x, y - s); c.lineTo(x + s, y + s * 0.7); c.lineTo(x - s, y + s * 0.7); }
            else { c.moveTo(x, y + s); c.lineTo(x + s, y - s * 0.7); c.lineTo(x - s, y - s * 0.7); }
            c.closePath();
            c.fillStyle = color;
            c.fill();
          }

          function paint() {
            var c = scr.ctx;
            scr.wall(S.t + 20.0, 0.95);
            scr.header();
            // countdown
            var s = Math.floor(S.sec);
            var label = s <= 0 ? "15:00" : "14:" + (60 - s < 10 ? "0" : "") + (60 - s);
            scr.text(label, SW / 2, 214, "800 112px " + MG.BR, "#EDE6D6", "center", 1, "alphabetic");
            // countdown ring segment under the digits
            MG.rr(c, 40, 236, SW - 80, 6, 3);
            c.fillStyle = "rgba(237,230,214,0.14)";
            c.fill();
            MG.rr(c, 40, 236, (SW - 80) * (1 - S.sec / 900), 6, 3);
            c.fillStyle = "#FACC15";
            c.fill();
            // value-free price line
            scr.glass(14, 270, 362, 250, 30, 1, "clear");
            c.save();
            c.beginPath();
            var n = PTS.length, lastX = 0, lastY = 0, upto = MG.clamp(S.draw, 0, 1) * (n - 1);
            for (var i = 0; i <= Math.floor(upto); i++) {
              var px = 34 + (i / (n - 1)) * 322, py = 490 - PTS[i] * 210;
              i ? c.lineTo(px, py) : c.moveTo(px, py);
              lastX = px; lastY = py;
            }
            var fr = upto - Math.floor(upto), j = Math.floor(upto);
            if (j < n - 1 && fr > 0) {
              lastX = 34 + ((j + fr) / (n - 1)) * 322;
              lastY = 490 - (PTS[j] + (PTS[j + 1] - PTS[j]) * fr) * 210;
              c.lineTo(lastX, lastY);
            }
            c.strokeStyle = "rgba(250,204,21,0.95)";
            c.lineWidth = 3;
            c.lineJoin = "round";
            c.stroke();
            c.setLineDash([4, 6]);
            c.beginPath();
            c.moveTo(34, 490 - 0.55 * 210);
            c.lineTo(356, 490 - 0.55 * 210);
            c.strokeStyle = "rgba(237,230,214,0.25)";
            c.lineWidth = 1;
            c.stroke();
            c.setLineDash([]);
            var g = c.createRadialGradient(lastX, lastY, 0, lastX, lastY, 26);
            g.addColorStop(0, "rgba(250,204,21,0.8)");
            g.addColorStop(1, "rgba(250,204,21,0)");
            c.fillStyle = g;
            c.fillRect(lastX - 26, lastY - 26, 52, 52);
            c.beginPath();
            c.arc(lastX, lastY, 6, 0, PI * 2);
            c.fillStyle = "#FACC15";
            c.fill();
            c.restore();
            // glass UP / DOWN toggle
            scr.glass(14, 552, 362, 150, 36, 1, "ink");
            var kx = 26 + S.knob * 172;
            scr.glass(kx, 564, 166, 126, 28, 1, S.knob < 0.5 ? "yes" : "no");
            var upOn = S.knob < 0.5;
            tri(c, 109, 608, 13, true, upOn ? "#000" : "#FACC15");
            scr.text("UP", 109, 650, "800 34px " + MG.BR, upOn ? "#000" : "#FACC15", "center", 1, "middle");
            tri(c, 281, 612, 13, false, upOn ? "#D94A3D" : "#EDE6D6");
            scr.text("DOWN", 281, 650, "800 34px " + MG.BR, upOn ? "#D94A3D" : "#EDE6D6", "center", 1, "middle");
            if (S.sel > 0.01) {
              MG.rr(c, kx - 4 * S.sel, 564 - 4 * S.sel, 166 + 8 * S.sel, 126 + 8 * S.sel, 30);
              c.strokeStyle = "rgba(250,204,21," + 0.85 * S.sel + ")";
              c.lineWidth = 2;
              c.stroke();
            }
            scr.homeBar();
          }

          function frame() {
            if (!built) return;
            paint();
            MG.render({
              cam: { x: S.cx, y: S.cy, z: S.cz, lx: 0.25, ly: -0.1, lz: 0, fov: 34 },
              bg: { t: S.t * 1.6 + 31.0, gx: 0.0, gy: -0.1, gs: 0.1, rib: 1.4, ox: -0.2, oy: 0.4 },
              rim: [2.5, 3.5, 2.0, 3.0],
              phone: { x: 0.3, y: -0.05, z: 0, rx: S.rx, ry: PI + 0.0, rz: S.rz, screen: scr.canvas },
            }, g2);
          }

          var inner = gsap.timeline({ paused: true });
          inner.to(S, { t: DUR, duration: DUR, ease: "none" }, 0);
          inner.to(S, { draw: 1, duration: DUR, ease: "none" }, 0);
          inner.to(S, { knob: 1, duration: 0.28, ease: "power3.inOut" }, 0.25);
          inner.to(S, { knob: 0, duration: 0.3, ease: "power3.inOut" }, 0.62);
          inner.to(S, { sel: 1, duration: 0.25, ease: "power2.out" }, 0.9);
          inner.to(S, { sec: 1, duration: 0.01, ease: "none" }, 1.3);
          inner.to(S, { rx: -0.5, rz: 0.22, cx: -0.25, cy: 2.8, cz: 5.0, duration: DUR, ease: MG.ease.drift }, 0);

          var drvT = 0, drv = {};
          Object.defineProperty(drv, "t", {
            get: function () { return drvT; },
            set: function (v) { drvT = v; inner.time(v, true); frame(); },
          });
          var tl = gsap.timeline({ paused: true });
          tl.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s33-brand", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);

          window.__hf.buildReady[ID] = MG.ready.then(MG.fonts).then(function () {
            scr = new MG.Screen();
            built = true;
            inner.time(drvT, true);
            frame();
          });
          window.__timelines[ID] = window.__hfPre(ID, tl);
        })();
      </script>
    </template>
  </body>
</html>
