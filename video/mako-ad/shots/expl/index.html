<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>EXPL storyboard shots</title>
<script src="assets/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#EBE5D9}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#EBE5D9}
.shot{position:absolute;inset:0}
</style>
</head>
<body>
<!-- EXPL shots placed back to back only for lint / snapshot. Film order and times live in SHOTS.md / CHANGES-v2.md.
     s14 0.0-1.5 | s18 1.5-3.5 | s19 3.5-6.0 | s21 6.0-7.5 | s25 7.5-9.0 | s29 9.0-11.0 | s35 11.0-12.5 -->
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="12.5">
  <div id="s14" class="shot" data-composition-id="s14" data-composition-src="compositions/s14.html" data-start="0" data-duration="1.5" data-track-index="1" data-width="1920" data-height="1080"></div>
  <div id="s18" class="shot" data-composition-id="s18" data-composition-src="compositions/s18.html" data-start="1.5" data-duration="2" data-track-index="1" data-width="1920" data-height="1080"></div>
  <div id="s19" class="shot" data-composition-id="s19" data-composition-src="compositions/s19.html" data-start="3.5" data-duration="2.5" data-track-index="1" data-width="1920" data-height="1080"></div>
  <div id="s21" class="shot" data-composition-id="s21" data-composition-src="compositions/s21.html" data-start="6" data-duration="1.5" data-track-index="1" data-width="1920" data-height="1080"></div>
  <div id="s25" class="shot" data-composition-id="s25" data-composition-src="compositions/s25.html" data-start="7.5" data-duration="1.5" data-track-index="1" data-width="1920" data-height="1080"></div>
  <div id="s29" class="shot" data-composition-id="s29" data-composition-src="compositions/s29.html" data-start="9" data-duration="2" data-track-index="1" data-width="1920" data-height="1080"></div>
  <div id="s35" class="shot" data-composition-id="s35" data-composition-src="compositions/s35.html" data-start="11" data-duration="1.5" data-track-index="1" data-width="1920" data-height="1080"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
