<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GLASS s04 (film 5.0-7.0, key 6.4 = local 1.4). Logo + wordmark etched in a frosted glass slab; slab tilts in. -->
  </head>
  <body>
    <template id="s04-template">
      <style>
        @font-face{font-family:"Bricolage Grotesque Variable";font-style:normal;font-weight:200 800;src:url("../assets/fonts/captured-bricolage-grotesque-latin-wght-normal.0hh3pksc_dt39.woff2") format("woff2-variations");}
        @font-face{font-family:"Inter Variable";font-style:normal;font-weight:100 900;src:url("../assets/fonts/captured-inter-latin-wght-normal.055ydel_y7o6i.woff2") format("woff2-variations");}
        @font-face{font-family:"JetBrains Mono";font-weight:100 800;src:url("../assets/fonts/jbmono-latin.woff2") format("woff2");}
        #s04-root{position:absolute;inset:0;overflow:hidden;background:#000;color:#EDE6D6;font-family:"Inter Variable",sans-serif}
        #s04-gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
      </style>
      <div id="s04-root" data-composition-id="s04" data-width="1920" data-height="1080" data-duration="2">
        <canvas id="s04-gl" width="1920" height="1080"></canvas>
      </div>
      <script src="../assets/glass/glass-kit.js"></script>
      <script>
        (function () {
          var ID = "s04", DUR = 2.0, MG = window.MakoGlass, PI = Math.PI;
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          var g2 = document.getElementById(ID + "-gl").getContext("2d");
          var slab = null, built = false;

          function paintFace(c) {
            var x = c.getContext("2d"), w = c.width, h = c.height;
            x.clearRect(0, 0, w, h);
            x.save();
            x.shadowColor = "rgba(0,0,0,0.45)";
            x.shadowBlur = 10;
            x.shadowOffsetY = 5;
            // lockup: fin + wordmark
            x.font = "800 250px " + MG.BR;
            x.textBaseline = "alphabetic";
            var word = "Mako Market";
            var ww = x.measureText(word).width;
            var fin = 230, gap = 46, total = fin + gap + ww;
            var lx = (w - total) / 2, by = h * 0.53;
            MG.fin(x, lx, by - 205, fin, "rgba(250,204,21,0.96)");
            x.fillStyle = "rgba(240,234,220,0.97)";
            x.fillText(word, lx + fin + gap, by);
            x.restore();
            // hairline
            x.fillStyle = "rgba(237,230,214,0.28)";
            x.fillRect(w * 0.5 - 520, h * 0.64, 1040, 3);
            x.font = "500 72px " + MG.IN;
            x.textAlign = "center";
            x.fillStyle = "rgba(237,230,214,0.82)";
            x.fillText("Short-form prediction markets on Monad", w / 2, h * 0.76);
          }

          var S = { ry: -0.66, rx: 0.24, rz: 0.05, y: -0.08, cx: 0.75, cy: -0.55, cz: 7.4, sheen: -1.2, glow: 0, t: 0, gs: 0.16 };
          function frame() {
            if (!built) return;
            MG.render({
              cam: { x: S.cx, y: S.cy, z: S.cz, lx: 0, ly: 0.02, lz: 0, fov: 34 },
              bg: { t: S.t * 1.6 + 3.0, gx: 0.05, gy: 0.0, gs: S.gs, rib: 1.9, ox: S.cx * 0.06 },
              rim: [3.5, 2.5, 4, 3.2],
              phone: null,
              slabs: [{ mesh: slab, x: 0, y: S.y, z: 0, rx: S.rx, ry: S.ry, rz: S.rz, sheen: S.sheen, glow: S.glow }],
            }, g2);
          }

          var inner = gsap.timeline({ paused: true });
          inner.to(S, { t: DUR, duration: DUR, ease: "none" }, 0);
          inner.to(S, { ry: -0.13, rx: 0.05, rz: 0.0, y: 0, duration: 1.25, ease: MG.ease.enter }, 0);
          inner.to(S, { ry: -0.08, rx: 0.03, duration: 0.75, ease: MG.ease.breathe }, 1.25);
          inner.to(S, { cx: 0.2, cy: -0.18, cz: 6.55, duration: DUR, ease: MG.ease.drift }, 0);
          inner.to(S, { sheen: 1.3, duration: 1.5, ease: "power1.inOut" }, 0.3);
          inner.to(S, { gs: 0.24, glow: 0.35, duration: 0.9, ease: "power2.out" }, 0.2);

          var drvT = 0, drv = {};
          Object.defineProperty(drv, "t", {
            get: function () { return drvT; },
            set: function (v) { drvT = v; inner.time(v, true); frame(); },
          });
          var tl = gsap.timeline({ paused: true });
          tl.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);

          window.__hf.buildReady[ID] = MG.ready.then(MG.fonts).then(function () {
            var face = MG.faceCanvas(2300, 1300);
            paintFace(face);
            slab = MG.slab({ w: 4.6, h: 2.6, r: 0.34, depth: 0.12, bevel: 0.07, face: face, frost: 0.014, lift: 1.0 });
            built = true;
            inner.time(drvT, true);
            frame();
          });
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
