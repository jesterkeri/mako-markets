<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GLASS s26 (film 35.0-36.5, key 36.2 = local 1.2). Glass Claim button presses; soft yellow pulse. Close-up, high angle. -->
  </head>
  <body>
    <template id="s26-template">
      <style>
        @font-face{font-family:"Bricolage Grotesque Variable";font-style:normal;font-weight:200 800;src:url("../assets/fonts/captured-bricolage-grotesque-latin-wght-normal.0hh3pksc_dt39.woff2") format("woff2-variations");}
        @font-face{font-family:"Inter Variable";font-style:normal;font-weight:100 900;src:url("../assets/fonts/captured-inter-latin-wght-normal.055ydel_y7o6i.woff2") format("woff2-variations");}
        @font-face{font-family:"JetBrains Mono";font-weight:100 800;src:url("../assets/fonts/jbmono-latin.woff2") format("woff2");}
        #s26-root{position:absolute;inset:0;overflow:hidden;background:#000;color:#EDE6D6;font-family:"Inter Variable",sans-serif}
        #s26-gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
        #s26-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,.4) 36%,rgba(0,0,0,0) 56%)}
        #s26-brand{position:absolute;left:140px;top:96px;display:flex;align-items:center;gap:14px;font:800 30px "Bricolage Grotesque Variable",sans-serif;letter-spacing:-.01em}
        #s26-brand svg{width:40px;height:31px;display:block}
        #s26-copy{position:absolute;left:140px;top:330px;width:900px}
        #s26-h1{font:800 112px/0.98 "Bricolage Grotesque Variable",sans-serif;letter-spacing:-.04em;color:#EDE6D6}
        #s26-h1 .ln{display:block;overflow:hidden;padding-bottom:12px}
        #s26-h1 .ln span{display:block;white-space:nowrap}
        #s26-h2{margin-top:26px;font:800 112px/0.98 "Bricolage Grotesque Variable",sans-serif;letter-spacing:-.04em;color:#FACC15}
      </style>
      <div id="s26-root" data-composition-id="s26" data-width="1920" data-height="1080" data-duration="1.5">
        <canvas id="s26-gl" width="1920" height="1080"></canvas>
        <div id="s26-shade"></div>
        <div id="s26-brand"><svg viewBox="-3 -3 406 316"><path fill="#EDE6D6" d="M 25,285 L 80,259 C 80,227 112,177 123,169 L 115,251 L 150,259 C 160,186 246,135 246,135 C 246,135 226,156 211,196 C 196,235 196,259 196,259 L 239,308 C 229,222 306,86 380,5 C 298,40 193,111 160,153 C 160,153 155,132 163,104 C 170,76 184,50 183,47 C 112,81 44,221 25,285 Z"/></svg><span>Mako Market</span></div>
        <div id="s26-copy">
          <div id="s26-h1"><span class="ln"><span>Claim your</span></span><span class="ln"><span>payout.</span></span></div>
          <div id="s26-h2">No deadline.</div>
        </div>
      </div>
      <script src="../assets/glass/glass-kit.js"></script>
      <script>
        (function () {
          var ID = "s26", DUR = 1.5, MG = window.MakoGlass, PI = Math.PI;
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          var g2 = document.getElementById(ID + "-gl").getContext("2d");
          var scr = null, built = false;
          var SW = MG.SW, SH = MG.SH;

          var S = { t: 0, press: 0, pulse: 0, glow: 0, cx: 2.2, cy: 1.6, cz: 4.2, ry: PI + 0.5, rx: 0.12 };

          function paint() {
            var c = scr.ctx;
            scr.wall(S.t + 12.0, 0.9 + 0.5 * S.glow);
            scr.header();
            // settled pool card
            scr.glass(14, 120, 362, 300, 30, 1, "clear");
            scr.chip("SETTLED", 32, 142, 1, "#FACC15", "#000");
            scr.text("Will Bitcoin close", 32, 210, "800 29px " + MG.BR, "#EDE6D6");
            scr.text("the week higher?", 32, 244, "800 29px " + MG.BR, "#EDE6D6");
            scr.glass(32, 284, 158, 110, 24, 1, "yes");
            scr.text("YES", 111, 339, "800 34px " + MG.BR, "#000", "center", 1, "middle");
            MG.rr(c, 200, 284, 158, 110, 24);
            c.fillStyle = "rgba(255,255,255,0.05)";
            c.fill();
            c.strokeStyle = "rgba(255,255,255,0.14)";
            c.lineWidth = 1;
            c.stroke();
            scr.text("NO", 279, 339, "800 34px " + MG.BR, "rgba(237,230,214,0.35)", "center", 1, "middle");
            // payout row (no amounts)
            scr.glass(14, 440, 362, 110, 26, 1, "clear");
            scr.text("YOUR PAYOUT", 34, 478, "600 11px " + MG.MO, "rgba(237,230,214,0.6)");
            MG.rr(c, 34, 498, 190, 24, 10);
            c.fillStyle = "rgba(250,204,21,0.75)";
            c.fill();
            MG.rr(c, 234, 498, 70, 24, 10);
            c.fillStyle = "rgba(237,230,214,0.22)";
            c.fill();
            // claim button with press + pulse
            var s = 1 - 0.06 * S.press;
            var bw = 362 * s, bh = 104 * s, bx = SW / 2 - bw / 2, by = 610 + (104 - bh) / 2;
            if (S.pulse > 0.001 && S.pulse < 1) {
              var e = S.pulse;
              for (var i = 0; i < 2; i++) {
                var ee = MG.clamp(e - i * 0.22, 0, 1);
                if (ee <= 0) continue;
                MG.rr(c, 14 - 34 * ee, 610 - 34 * ee, 362 + 68 * ee, 104 + 68 * ee, 30 + 30 * ee);
                c.strokeStyle = "rgba(250,204,21," + 0.8 * (1 - ee) + ")";
                c.lineWidth = 3 - 2 * ee;
                c.stroke();
              }
            }
            if (S.glow > 0.01) {
              var g = c.createRadialGradient(SW / 2, 662, 0, SW / 2, 662, 260);
              g.addColorStop(0, "rgba(250,204,21," + 0.42 * S.glow + ")");
              g.addColorStop(1, "rgba(250,204,21,0)");
              c.fillStyle = g;
              c.fillRect(0, 380, SW, 464);
            }
            scr.glass(bx, by, bw, bh, 30 * s, 1, "yes");
            scr.text("CLAIM", SW / 2, by + bh / 2 + 1, "800 " + Math.round(34 * s) + "px " + MG.BR, "#000", "center", 1, "middle");
            scr.homeBar();
          }

          function frame() {
            if (!built) return;
            paint();
            MG.render({
              cam: { x: S.cx, y: S.cy, z: S.cz, lx: 0.2, ly: -0.5, lz: 0, fov: 30 },
              bg: { t: S.t * 1.6 + 23.0, gx: 0.6, gy: -0.6, gs: 0.06 + 0.16 * S.glow, rib: 1.0, ox: 0.6, oy: 0.3 },
              rim: [3.5, -1.5, 3, 3.2 + 3.5 * S.glow],
              phone: { x: 0.95, y: 0.2, z: 0, rx: S.rx, ry: S.ry, rz: 0.04, screen: scr.canvas },
            }, g2);
          }

          var inner = gsap.timeline({ paused: true });
          inner.to(S, { t: DUR, duration: DUR, ease: "none" }, 0);
          inner.to(S, { press: 1, duration: 0.12, ease: "power2.in" }, 0.45);
          inner.to(S, { press: 0, duration: 0.4, ease: "back.out(2)" }, 0.58);
          inner.fromTo(S, { pulse: 0 }, { pulse: 1, duration: 0.95, ease: "power1.out" }, 0.55);
          inner.to(S, { glow: 1, duration: 0.25, ease: "power2.out" }, 0.55);
          inner.to(S, { glow: 0.4, duration: 0.7, ease: "power2.inOut" }, 0.8);
          inner.to(S, { cx: 1.85, cy: 1.25, cz: 3.7, ry: PI + 0.42, duration: DUR, ease: MG.ease.drift }, 0);

          var drvT = 0, drv = {};
          Object.defineProperty(drv, "t", {
            get: function () { return drvT; },
            set: function (v) { drvT = v; inner.time(v, true); frame(); },
          });
          var tl = gsap.timeline({ paused: true });
          tl.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s26-h1 .ln > span", { yPercent: 108, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.7, ease: "expo.out", stagger: 0.1 }, 0.0);
          tl.fromTo("#s26-h2", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0.55);
          tl.fromTo("#s26-brand", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);

          window.__hf.buildReady[ID] = MG.ready.then(MG.fonts).then(function () {
            scr = new MG.Screen();
            built = true;
            inner.time(drvT, true);
            frame();
          });
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
