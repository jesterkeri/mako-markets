<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GLASS s16 (film 19.5-21.0, key 20.6 = local 1.1). A 3D glass toast drops onto the phone. Low angle, close. -->
  </head>
  <body>
    <template id="s16-template">
      <style>
        @font-face{font-family:"Bricolage Grotesque Variable";font-style:normal;font-weight:200 800;src:url("../assets/fonts/captured-bricolage-grotesque-latin-wght-normal.0hh3pksc_dt39.woff2") format("woff2-variations");}
        @font-face{font-family:"Inter Variable";font-style:normal;font-weight:100 900;src:url("../assets/fonts/captured-inter-latin-wght-normal.055ydel_y7o6i.woff2") format("woff2-variations");}
        @font-face{font-family:"JetBrains Mono";font-weight:100 800;src:url("../assets/fonts/jbmono-latin.woff2") format("woff2");}
        #s16-root{position:absolute;inset:0;overflow:hidden;background:#000;color:#EDE6D6;font-family:"Inter Variable",sans-serif}
        #s16-gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
      </style>
      <div id="s16-root" data-composition-id="s16" data-width="1920" data-height="1080" data-duration="1.5">
        <canvas id="s16-gl" width="1920" height="1080"></canvas>
      </div>
      <script src="../assets/glass/glass-kit.js"></script>
      <script>
        (function () {
          var ID = "s16", DUR = 1.5, MG = window.MakoGlass, PI = Math.PI;
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          var g2 = document.getElementById(ID + "-gl").getContext("2d");
          var scr = null, toast = null, built = false;
          var SW = MG.SW, SH = MG.SH;

          function paintFace(cv) {
            var x = cv.getContext("2d"), w = cv.width, h = cv.height;
            x.clearRect(0, 0, w, h);
            MG.rr(x, 44, 44, h - 88, h - 88, 64);
            x.fillStyle = "#FACC15";
            x.fill();
            MG.fin(x, 44 + (h - 88) * 0.14, 44 + (h - 88) * 0.2, (h - 88) * 0.72, "#000");
            var tx = h + 10;
            x.font = "600 50px " + MG.IN;
            x.fillStyle = "rgba(237,230,214,0.7)";
            x.textBaseline = "alphabetic";
            x.fillText("Mako Market", tx, h * 0.33);
            x.save();
            x.shadowColor = "rgba(0,0,0,0.4)";
            x.shadowBlur = 8;
            x.shadowOffsetY = 4;
            x.font = "800 150px " + MG.BR;
            x.fillStyle = "rgba(240,234,220,0.98)";
            x.fillText("Free test USDC", tx, h * 0.77);
            x.restore();
          }

          var S = { t: 0, drop: 0, land: 0, sheen: -1.2, glow: 0,
            ry: PI + 0.3, rx: -0.1, rz: 0.05, cx: -0.8, cy: -1.05, cz: 4.4 };

          function paint() {
            var c = scr.ctx;
            scr.wall(S.t + 5.0, 1.0);
            scr.header();
            // a pool card sitting under where the toast lands
            scr.glass(14, 196, 362, 386, 30, 1, "clear");
            scr.chip("CRYPTO", 32, 218, 1);
            scr.text("Will Bitcoin close", 32, 286, "800 29px " + MG.BR, "#EDE6D6");
            scr.text("the week higher?", 32, 320, "800 29px " + MG.BR, "#EDE6D6");
            scr.trend(32, 362, 326, 70, S.t, 1);
            scr.glass(32, 458, 158, 92, 22, 1, "yes");
            scr.glass(200, 458, 158, 92, 22, 1, "no");
            scr.text("YES", 111, 504, "800 32px " + MG.BR, "#000", "center", 1, "middle");
            scr.text("NO", 279, 504, "800 32px " + MG.BR, "#EDE6D6", "center", 1, "middle");
            // landing glow on the screen
            if (S.land > 0.01) {
              var g = c.createRadialGradient(SW / 2, 140, 0, SW / 2, 140, 220);
              g.addColorStop(0, "rgba(250,204,21," + 0.35 * S.land + ")");
              g.addColorStop(1, "rgba(250,204,21,0)");
              c.fillStyle = g;
              c.fillRect(0, 0, SW, 400);
            }
            scr.homeBar();
          }

          function frame() {
            if (!built) return;
            paint();
            var q = MG.ease.notify(MG.clamp(S.drop, 0, 1));
            var bounce = Math.sin(MG.clamp(S.drop, 0, 1) * PI) * 0.06;
            MG.render({
              cam: { x: S.cx, y: S.cy, z: S.cz, lx: 0.4, ly: 0.8, lz: 0, fov: 34 },
              bg: { t: S.t * 1.6 + 15.0, gx: 0.3, gy: 0.55, gs: 0.1 + 0.08 * S.land, rib: 1.2, ox: -0.3, oy: 0.2 },
              rim: [3, 4, 2.5, 3.2 + 2.0 * S.land],
              phone: { x: 0.45, y: -0.05, z: 0, rx: S.rx, ry: S.ry, rz: S.rz, screen: scr.canvas },
              slabs: [{ mesh: toast, x: 0, y: 1.0 + (1 - q) * 1.9 + bounce, z: -0.2 - (1 - q) * 0.55, rx: 0.22 + (1 - q) * -0.5, ry: PI + (1 - q) * 0.18, rz: (1 - q) * 0.12, sheen: S.sheen, glow: S.glow }],
            }, g2);
          }

          var inner = gsap.timeline({ paused: true });
          inner.to(S, { t: DUR, duration: DUR, ease: "none" }, 0);
          inner.fromTo(S, { drop: 0.18 }, { drop: 1, duration: 0.62, ease: "none" }, 0);
          inner.to(S, { land: 1, duration: 0.18, ease: "power2.out" }, 0.55);
          inner.to(S, { land: 0.45, duration: 0.7, ease: "power2.inOut" }, 0.75);
          inner.to(S, { glow: 0.6, duration: 0.25, ease: "power2.out" }, 0.55);
          inner.to(S, { sheen: 1.4, duration: 0.9, ease: "power1.inOut" }, 0.5);
          inner.to(S, { ry: PI + 0.18, rx: -0.05, rz: 0.03, duration: DUR, ease: MG.ease.drift }, 0);
          inner.to(S, { cx: -0.5, cy: -0.85, cz: 3.85, duration: DUR, ease: MG.ease.drift }, 0);

          var drvT = 0, drv = {};
          Object.defineProperty(drv, "t", {
            get: function () { return drvT; },
            set: function (v) { drvT = v; inner.time(v, true); frame(); },
          });
          var tl = gsap.timeline({ paused: true });
          tl.to(drv, { t: DUR, duration: DUR, ease: "none" }, 0);

          window.__hf.buildReady[ID] = MG.ready.then(MG.fonts).then(function () {
            scr = new MG.Screen();
            var face = MG.faceCanvas(1960, 500);
            paintFace(face);
            toast = MG.slab({ w: 1.96, h: 0.5, r: 0.15, depth: 0.04, bevel: 0.025, face: face, parent: "phone", frost: 0.01, lift: 0.95 });
            built = true;
            inner.time(drvT, true);
            frame();
          });
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
