.pl3 b small{font:700 18px Inter;letter-spacing:0;color:#0A0A0A;opacity:.72;margin-left:6px}

.ftr{position:absolute;left:76px;right:76px;bottom:58px;height:84px;display:flex;justify-content:space-between;align-items:center}
.who{display:flex;align-items:center;gap:16px}

.who span{position:absolute;left:0;top:calc(100% + 8px);white-space:nowrap;font-size:14px;color:#8a857a}
.cta{display:flex;align-items:center;gap:14px}
.qr{width:84px;height:84px;background:#EDE6D6;border-radius:14px;padding:9px}
.qrs{width:100%;height:100%;display:block}
.u{color:#000;background:#FACC15;border-radius:999px;padding:16px 30px;font:800 28px "Bricolage Grotesque";letter-spacing:-.01em}
